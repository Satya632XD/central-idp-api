services:
  - type: web
    name: central-idp-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_KEY_ID
        sync: false
      - key: JWT_ISSUER
        value: https://central-idp-api.onrender.com
      - key: JWT_AUDIENCE
        value: central-idp-clients
      - key: JWT_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: JWT_REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: RP_NAME
        value: "Central Gaming IdP"
      - key: RP_ID
        value: "central-idp-api.onrender.com"
      - key: RP_ORIGIN
        value: "https://central-idp-api.onrender.com"
      - key: FRONTEND_URL
        value: "https://central-idp-api.onrender.com"
      - key: CORS_ORIGIN
        value: "*"
